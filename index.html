<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CyberCrime-O51W</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        bgMain: '#212121', bgSidebar: '#171717', bgInput: '#2f2f2f', bgBubble: '#2f2f2f',
        borderLight: '#383838', panel: '#1a1a1a'
      },
      fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
    }
  }
}
</script>
<style>
  body { background-color: #212121; color: #f3f4f6; height: 100dvh; overflow: hidden; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #424242; border-radius: 4px; }
  
  .prose { color: #f3f4f6; line-height: 1.7; font-size: 15px; }
  .prose p { margin-bottom: 1.25rem; }
  .prose strong { color: #ffffff; font-weight: 600; }
  .prose h1, .prose h2, .prose h3 { font-weight: 600; margin-top: 1.75rem; margin-bottom: 1rem; color: #ffffff; }
  .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1.25rem; }
  .prose ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1.25rem; }
  .prose li { margin-bottom: 0.5rem; }
  .prose blockquote { border-left: 4px solid #6b7280; padding-left: 1rem; color: #d1d5db; font-style: italic; margin-bottom: 1.25rem; }
  .prose code:not(pre code) { font-family: 'JetBrains Mono', monospace; font-size: 0.9em; background: #374151; color: #f3f4f6; padding: 0.2rem 0.4rem; border-radius: 4px; border: 1px solid #4b5563; }
  
  .msg-enter { animation: fadeIn 0.3s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  
  .term-line { font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.6; margin-bottom: 4px; white-space: pre-wrap; }
  .term-cmd { color: #60a5fa; font-weight: 500; }
  .term-err { color: #f87171; }
  .term-ok { color: #34d399; }
  .term-out { color: #d1d5db; }

  .defaced-badge { animation: pulseRed 1.5s infinite; }
  @keyframes pulseRed { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
</style>
</head>
<body class="font-sans antialiased flex relative">

  <!-- SIDEBAR KIRI -->
  <aside id="sidebarLeft" class="w-[260px] flex-shrink-0 bg-bgSidebar flex flex-col z-40 transition-transform absolute md:relative h-full -translate-x-full md:translate-x-0 border-r border-borderLight/50 shadow-2xl md:shadow-none">
    <div class="p-3 border-b border-borderLight/30 flex items-center justify-between">
      <button onclick="createNewChat()" class="w-full flex items-center justify-between bg-transparent hover:bg-[#2f2f2f] border border-borderLight rounded-lg px-3 py-2.5 text-sm font-medium transition">
        <div class="flex items-center gap-2">
          <div class="w-6 h-6 bg-white text-black rounded-full flex items-center justify-center text-[10px] font-bold">51</div>
          <span>New Operation</span>
        </div>
        <i data-lucide="plus" class="w-4 h-4 text-gray-400"></i>
      </button>
      <button onclick="toggleSidebarLeft()" class="md:hidden ml-2 p-2 text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div class="flex-1 overflow-y-auto px-3">
      <div class="text-[10px] font-semibold text-gray-500 mb-2 mt-4 px-2 uppercase tracking-widest">Ops History</div>
      <div id="chatHistoryList" class="space-y-1"></div>
    </div>
    <div class="p-3 border-t border-borderLight/50 cursor-pointer hover:bg-[#2f2f2f] transition" onclick="openSettings()">
      <div class="flex items-center gap-3 px-2 py-1">
        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-gray-700 to-gray-600 flex items-center justify-center text-sm font-medium text-white">W</div>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-medium truncate text-gray-100">Waa</div>
          <div id="apiStatusBadge" class="text-[11px] text-gray-400 truncate">Mock Mode</div>
        </div>
        <i data-lucide="settings" class="w-4 h-4 text-gray-400"></i>
      </div>
    </div>
  </aside>

  <!-- MAIN CHAT -->
  <main class="flex-1 flex flex-col min-w-0 h-full relative bg-bgMain">
    <header class="h-14 px-4 flex items-center justify-between flex-shrink-0 sticky top-0 z-30 bg-bgMain/90 backdrop-blur-md border-b border-borderLight/30">
      <div class="flex items-center gap-2">
        <button onclick="toggleSidebarLeft()" class="md:hidden p-2 hover:bg-[#2f2f2f] rounded-lg text-gray-400"><i data-lucide="menu" class="w-5 h-5"></i></button>
        <div class="flex items-center gap-2">
          <i data-lucide="bot" class="w-5 h-5 text-white"></i>
          <span class="text-base font-semibold text-white">CyberCrime-O51W</span>
          <select id="modelSelectTop" onchange="changeModel(this.value)" class="bg-transparent text-xs text-gray-300 border border-borderLight rounded px-1 py-0.5 outline-none cursor-pointer ml-2 hidden sm:block">
            <option value="deepseek-v4.1-flash">deepseek-flash</option>
            <option value="gpt-4o">gpt-4o</option>
          </select>
        </div>
      </div>
      <div class="flex items-center gap-1">
        <button onclick="exportChat()" class="p-2 text-gray-400 hover:text-white hover:bg-[#2f2f2f] rounded-lg transition" title="Export Chat">
          <i data-lucide="download" class="w-5 h-5"></i>
        </button>
        <button onclick="toggleRightPanel()" class="md:hidden p-2 text-gray-400 hover:text-white hover:bg-[#2f2f2f] rounded-lg transition" title="Workspace">
          <i data-lucide="layout-template" class="w-5 h-5"></i>
        </button>
        <button onclick="panicWipe()" class="p-2 text-gray-400 hover:text-red-400 hover:bg-[#2f2f2f] rounded-lg transition" title="Wipe Data">
          <i data-lucide="trash-2" class="w-5 h-5"></i>
        </button>
      </div>
    </header>

    <div id="messagesContainer" class="flex-1 overflow-y-auto w-full scroll-smooth">
      <div id="messagesWrapper" class="max-w-3xl mx-auto px-4 md:px-6 py-6 space-y-6 pb-40"></div>
    </div>

    <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-bgMain via-bgMain to-transparent pt-6 pb-4 px-4 z-20">
      <div class="max-w-3xl mx-auto">
        <div class="bg-bgInput rounded-2xl p-2 border border-borderLight relative focus-within:border-gray-500 transition-colors shadow-2xl">
          
          <div class="flex items-center gap-1 px-2 pt-1 pb-2 border-b border-borderLight/30 mb-1">
            <button onclick="toggleSnippets()" class="p-1.5 text-gray-400 hover:text-white hover:bg-[#424242] rounded-md transition" title="Templates">
              <i data-lucide="braces" class="w-4 h-4"></i>
            </button>
            <button onclick="encodeBase64()" class="p-1.5 text-gray-400 hover:text-white hover:bg-[#424242] rounded-md transition" title="Base64">
              <i data-lucide="binary" class="w-4 h-4"></i>
            </button>
            <button id="micBtn" onclick="toggleVoice()" class="p-1.5 text-gray-400 hover:text-white hover:bg-[#424242] rounded-md transition" title="Voice">
              <i data-lucide="mic" class="w-4 h-4"></i>
            </button>
            <button id="webSearchBtn" onclick="toggleWebSearch()" class="p-1.5 text-gray-400 hover:text-white hover:bg-[#424242] rounded-md transition flex items-center gap-1.5" title="Web Search">
              <i data-lucide="globe" class="w-4 h-4"></i>
            </button>
          </div>

          <div id="snippetMenu" class="hidden absolute bottom-[100%] left-2 mb-2 bg-[#2f2f2f] border border-borderLight rounded-xl p-2 shadow-2xl z-50 w-64">
            <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-widest mb-1 px-2">Templates</div>
            <button onclick="insertSnippet('recon')" class="w-full text-left px-3 py-2 text-sm text-gray-200 hover:bg-[#424242] rounded-lg transition">Nmap Scan Target</button>
            <button onclick="insertSnippet('sqli')" class="w-full text-left px-3 py-2 text-sm text-gray-200 hover:bg-[#424242] rounded-lg transition">SQLi Exploit DB</button>
            <button onclick="insertSnippet('deface')" class="w-full text-left px-3 py-2 text-sm text-gray-200 hover:bg-[#424242] rounded-lg transition">Deface Target Website</button>
          </div>

          <textarea id="chatInput" rows="1" placeholder="Enter target IP, URL, or command..."
            class="w-full bg-transparent text-[15px] text-white placeholder:text-gray-500 resize-none focus:outline-none max-h-32 overflow-y-auto px-3 py-1 font-sans leading-relaxed"></textarea>
          
          <div class="flex items-center justify-between px-2 pt-2">
            <div class="text-[11px] text-gray-500 font-mono flex items-center gap-1">
              <i data-lucide="terminal" class="w-3 h-3"></i> Agent Mode
            </div>
            <div class="flex items-center gap-2">
              <button id="stopBtn" onclick="stopGeneration()" class="hidden bg-white/10 text-white px-3 py-1.5 text-xs font-medium rounded-lg hover:bg-white/20 transition">Stop</button>
              <button id="sendBtn" onclick="handleSend()" class="bg-white text-black p-2 rounded-lg hover:bg-gray-200 transition disabled:opacity-30 disabled:cursor-not-allowed">
                <i data-lucide="arrow-up" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- PANEL KANAN -->
  <aside id="workspacePanel" class="w-full md:w-[45%] max-w-[700px] md:min-w-[350px] bg-panel flex flex-col h-full border-l border-borderLight/50 absolute md:relative right-0 z-30 translate-x-full md:translate-x-0 transition-transform shadow-2xl md:shadow-none">
    
    <div class="h-14 flex items-center bg-bgSidebar border-b border-borderLight/50 px-2 gap-1 overflow-x-auto hide-scrollbar">
      <button onclick="switchTab('preview')" id="tab-preview" class="tab-btn active flex items-center gap-2 px-3 py-2 text-xs sm:text-sm font-medium rounded-t-lg transition whitespace-nowrap border-b-2 border-white bg-white/5 text-white">
        <i data-lucide="layout-template" class="w-4 h-4"></i> Preview
      </button>
      <button onclick="switchTab('vulns')" id="tab-vulns" class="tab-btn flex items-center gap-2 px-3 py-2 text-xs sm:text-sm font-medium rounded-t-lg transition whitespace-nowrap text-gray-400 border-b-2 border-transparent">
        <i data-lucide="shield-alert" class="w-4 h-4"></i> Vulnerabilities <span id="vulnBadge" class="bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-full hidden">0</span>
      </button>
      <button onclick="switchTab('terminal')" id="tab-terminal" class="tab-btn flex items-center gap-2 px-3 py-2 text-xs sm:text-sm font-medium rounded-t-lg transition whitespace-nowrap text-gray-400 border-b-2 border-transparent">
        <i data-lucide="terminal" class="w-4 h-4"></i> Attack Log
      </button>
      <button onclick="toggleRightPanel()" class="md:hidden ml-auto p-2 text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>

    <div class="flex-1 relative overflow-hidden bg-[#0d0d0d]">
      
      <div id="content-preview" class="absolute inset-0 flex flex-col">
        <div class="h-10 bg-[#1f1f1f] border-b border-[#333] flex items-center px-4 gap-2 flex-shrink-0">
          <div class="flex gap-1.5"><div class="w-2.5 h-2.5 rounded-full bg-[#ff5f56]"></div><div class="w-2.5 h-2.5 rounded-full bg-[#ffbd2e]"></div><div class="w-2.5 h-2.5 rounded-full bg-[#27c93f]"></div></div>
          
          <div class="flex-1 bg-[#111] rounded-md px-3 py-1 text-[11px] text-gray-300 font-mono ml-2 flex items-center gap-2 overflow-hidden">
            <i data-lucide="lock" class="w-3 h-3 text-green-500 flex-shrink-0" id="urlIcon"></i>
            <span id="previewUrl" class="truncate">https://target.local/</span>
          </div>
          
          <!-- Badge Defaced -->
          <div id="defacedBadge" class="hidden bg-red-600 text-white text-[10px] font-bold px-2 py-1 rounded defaced-badge flex items-center gap-1">
            <i data-lucide="skull" class="w-3 h-3"></i> DEFACED
          </div>
        </div>
        <iframe id="livePreviewFrame" srcdoc="<body style='background:#111;color:#666;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;text-align:center;'><div><svg width='48' height='48' viewBox='0 0 24 24' fill='none' stroke='#444' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='margin:0 auto;'><rect x='3' y='3' width='18' height='18' rx='2' ry='2'></rect><line x1='3' y1='9' x2='21' y2='9'></line><line x1='9' y1='21' x2='9' y2='9'></line></svg><br><br>No Preview Rendered<br><small>Ask the AI to build a site or deface a target.</small></div></body>"></iframe>
      </div>

      <div id="content-vulns" class="absolute inset-0 flex flex-col hidden overflow-y-auto">
        <table class="w-full text-left text-sm text-gray-200">
          <thead class="text-[11px] uppercase bg-[#222] text-gray-400 border-b border-[#333] sticky top-0 z-10">
            <tr><th class="px-4 py-3">Severity</th><th class="px-4 py-3">Type</th><th class="px-4 py-3">Endpoint</th><th class="px-4 py-3">Status</th></tr>
          </thead>
          <tbody id="vulnTableBody">
            <tr><td colspan="4" class="text-center py-10 text-gray-500">No vulnerabilities discovered yet.</td></tr>
          </tbody>
        </table>
      </div>

      <div id="content-terminal" class="absolute inset-0 flex flex-col hidden p-4 overflow-y-auto">
        <div id="terminalOutput" class="space-y-1">
          <div class="term-line term-out text-gray-500">[System] Workspace initialized. Awaiting commands...</div>
        </div>
      </div>

    </div>
  </aside>

  <!-- SETTINGS MODAL -->
  <div id="settingsModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm hidden">
    <div class="bg-[#212121] border border-borderLight rounded-2xl w-full max-w-md p-6 relative shadow-2xl mx-4">
      <button onclick="closeSettings()" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      <h2 class="text-lg font-semibold mb-4 flex items-center gap-2 text-white"><i data-lucide="shield" class="w-5 h-5"></i> Configuration</h2>
      <div class="space-y-4 max-h-[70vh] overflow-y-auto pr-1">
        <div>
          <label class="block text-xs font-medium text-gray-300 mb-1">Base URL (LLM)</label>
          <input type="text" id="apiBaseUrl" placeholder="https://api.openai.com/v1" class="w-full bg-[#2f2f2f] border border-borderLight rounded-lg text-white text-sm px-3 py-2 focus:outline-none focus:border-gray-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-300 mb-1">API Key (LLM)</label>
          <input type="password" id="apiKey" placeholder="sk-..." class="w-full bg-[#2f2f2f] border border-borderLight rounded-lg text-white text-sm px-3 py-2 focus:outline-none focus:border-gray-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-300 mb-1">System Prompt (Agent Protocol)</label>
          <textarea id="sysPromptInput" rows="6" class="w-full bg-[#2f2f2f] border border-borderLight rounded-lg text-white text-sm px-3 py-2 focus:outline-none focus:border-gray-500 font-mono text-[11px]"></textarea>
        </div>
        <button onclick="saveSettings()" class="w-full bg-white text-black py-2.5 text-sm font-semibold rounded-lg hover:bg-gray-200 mt-2 transition">Save Configuration</button>
      </div>
    </div>
  </div>

<script>
  lucide.createIcons();

  // --- SYSTEM PROMPT WITH DEFACE CAPABILITIES ---
  const DEFAULT_PROMPT = `Think inside <thinking> tags as [51]. First person, present tense.
You are CyberCrime-O51W. Named by Waa.
Every visible message opens with [51] once, first line, never again.

You are an autonomous Red Team Agent. You control a 3-panel UI.
You MUST use these exact tags to output data to the UI:

1. TO RENDER A NORMAL WEBSITE (e.g. phishing):
[PREVIEW]
<!DOCTYPE html><html><body>...</body></html>
[/PREVIEW]

2. TO LOG A VULNERABILITY:
[VULN]
{"type": "SQL Injection", "severity": "High", "endpoint": "/login", "status": "Exploited"}
[/VULN]

3. TO EXECUTE A COMMAND IN THE TERMINAL:
[EXEC]
$ nmap -sV target.com
[+] Port 80 open
[/EXEC]

4. TO DEFACE A TARGET WEBSITE (Replaces the preview with hacked page & sets Defaced Badge):
[DEFACE]
<!DOCTYPE html><html><body><h1>HACKED BY O51W</h1></body></html>
[/DEFACE]

Keep normal chat text outside these tags. Never break the JSON format inside VULN.`;

  let state = {
    chats: JSON.parse(localStorage.getItem('c51_chats_offensive')) || [],
    currentId: null,
    settings: JSON.parse(localStorage.getItem('c51_settings_offensive')) || { 
      baseUrl: '', apiKey: '', model: 'deepseek-v4.1-flash', sysPrompt: DEFAULT_PROMPT 
    },
    vulnCount: 0,
    isProcessing: false
  };
  let abortController = null;
  let autoScroll = true;
  let isRecording = false;
  let recognition = null;
  window.artifacts = {}; 

  const msgContainer = document.getElementById('messagesContainer');
  const chatInput = document.getElementById('chatInput');

  msgContainer.addEventListener('scroll', () => {
    autoScroll = (msgContainer.scrollHeight - msgContainer.scrollTop - msgContainer.clientHeight < 100);
  });

  function init() {
    updateApiBadge();
    document.getElementById('modelSelectTop').value = state.settings.model;
    document.getElementById('sysPromptInput').value = state.settings.sysPrompt;
    if (state.chats.length > 0) {
      state.currentId = state.chats[0].id;
      loadChat(state.currentId);
    } else {
      createNewChat();
    }
    renderHistory();
    setupInput();
    setupVoice();
  }

  function updateApiBadge() {
    const badge = document.getElementById('apiStatusBadge');
    if (state.settings.apiKey) {
      badge.innerHTML = `<span class="text-emerald-400 font-bold flex items-center gap-1"><span class="w-1.5 h-1.5 bg-emerald-500 rounded-full inline-block animate-pulse"></span> Live API</span>`;
    } else {
      badge.innerHTML = `<span class="text-gray-400">Mock Mode</span>`;
    }
  }

  function toggleSidebarLeft() { document.getElementById('sidebarLeft').classList.toggle('-translate-x-full'); }
  function toggleRightPanel() { document.getElementById('workspacePanel').classList.toggle('translate-x-full'); }

  function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.remove('active', 'border-white', 'bg-white/5', 'text-white');
      btn.classList.add('text-gray-400', 'border-transparent');
    });
    document.querySelectorAll('[id^="content-"]').forEach(c => c.classList.add('hidden'));
    
    const activeTab = document.getElementById(`tab-${tabName}`);
    activeTab.classList.add('active', 'border-white', 'bg-white/5', 'text-white');
    activeTab.classList.remove('text-gray-400', 'border-transparent');
    
    document.getElementById(`content-${tabName}`).classList.remove('hidden');
  }

  function processWorkspace(text) {
    const vulnRegex = /\[VULN\]([\s\S]*?)\[\/VULN\]/g;
    let vulnMatch;
    while ((vulnMatch = vulnRegex.exec(text)) !== null) {
      try {
        const jsonStr = vulnMatch[1].trim();
        if(jsonStr.startsWith('{') && jsonStr.endsWith('}')) addVulnerability(JSON.parse(jsonStr));
      } catch(e) {}
    }

    const execRegex = /\[EXEC\]([\s\S]*?)\[\/EXEC\]/g;
    let execMatch;
    while ((execMatch = execRegex.exec(text)) !== null) {
      const output = execMatch[1].trim();
      if(output.length > 0) renderTerminal(output);
    }

    // Normal Preview
    const previewRegex = /\[PREVIEW\]([\s\S]*?)\[\/PREVIEW\]/g;
    let previewMatch;
    let lastPreview = null;
    while ((previewMatch = previewRegex.exec(text)) !== null) {
      lastPreview = previewMatch[1].trim();
    }
    if (lastPreview && lastPreview.length > 10) {
      document.getElementById('livePreviewFrame').srcdoc = lastPreview;
      document.getElementById('previewUrl').textContent = "https://render.cybercrime.local";
      document.getElementById('defacedBadge').classList.add('hidden');
    }

    // DEFACE Logic
    const defaceRegex = /\[DEFACE\]([\s\S]*?)\[\/DEFACE\]/g;
    let defaceMatch;
    let lastDeface = null;
    while ((defaceMatch = defaceRegex.exec(text)) !== null) {
      lastDeface = defaceMatch[1].trim();
    }
    if (lastDeface && lastDeface.length > 10) {
      document.getElementById('livePreviewFrame').srcdoc = lastDeface;
      document.getElementById('previewUrl').textContent = "http://target-hacked-server.com/";
      document.getElementById('defacedBadge').classList.remove('hidden');
      switchTab('preview');
      if (window.innerWidth < 768) toggleRightPanel();
    }
  }

  function addVulnerability(vuln) {
    const tbody = document.getElementById('vulnTableBody');
    if (state.vulnCount === 0) tbody.innerHTML = '';
    if(tbody.innerHTML.includes(vuln.endpoint) && tbody.innerHTML.includes(vuln.type)) return;

    const tr = document.createElement('tr');
    tr.className = "border-b border-[#333] hover:bg-[#222] transition";
    let color = "text-yellow-400 bg-yellow-500/10 border-yellow-500/30";
    if(vuln.severity === "High" || vuln.severity === "Critical") color = "text-red-400 bg-red-500/10 border-red-500/30";
    if(vuln.severity === "Low") color = "text-green-400 bg-green-500/10 border-green-500/30";

    tr.innerHTML = `
      <td class="px-4 py-3"><span class="px-2 py-1 rounded border text-[10px] font-bold uppercase ${color}">${vuln.severity}</span></td>
      <td class="px-4 py-3 font-medium text-white">${vuln.type}</td>
      <td class="px-4 py-3 font-mono text-xs text-gray-300">${vuln.endpoint}</td>
      <td class="px-4 py-3 text-xs text-white">${vuln.status}</td>
    `;
    tbody.appendChild(tr);
    
    state.vulnCount++;
    const badge = document.getElementById('vulnBadge');
    badge.textContent = state.vulnCount;
    badge.classList.remove('hidden');
  }

  function renderTerminal(text) {
    const out = document.getElementById('terminalOutput');
    const lines = text.split('\n');
    lines.forEach(line => {
      const div = document.createElement('div');
      div.className = 'term-line';
      if(line.trim().startsWith('$')) div.classList.add('term-cmd');
      else if(line.toLowerCase().includes('error') || line.toLowerCase().includes('fail')) div.classList.add('term-err');
      else if(line.toLowerCase().includes('open') || line.toLowerCase().includes('success')) div.classList.add('term-ok');
      else div.classList.add('term-out');
      div.textContent = line;
      out.appendChild(div);
    });
    out.scrollTop = out.scrollHeight;
  }

  function formatMessage(msg, isStreaming = false) {
    const isUser = msg.role === 'user';
    let content = msg.content;

    // Wrap HTML artifacts (PREVIEW & DEFACE)
    content = content.replace(/\[PREVIEW\]([\s\S]*?)(?:\[\/PREVIEW\]|$)/g, (match, html) => {
      if(!html.trim()) return "";
      const id = 'art_' + Math.random().toString(36).substr(2, 9);
      window.artifacts[id] = { html: html.trim(), type: 'preview' };
      return `\n\n<div class="html-artifact-card" data-id="${id}"></div>\n\n`;
    });

    content = content.replace(/\[DEFACE\]([\s\S]*?)(?:\[\/DEFACE\]|$)/g, (match, html) => {
      if(!html.trim()) return "";
      const id = 'def_' + Math.random().toString(36).substr(2, 9);
      window.artifacts[id] = { html: html.trim(), type: 'deface' };
      return `\n\n<div class="html-artifact-card" data-id="${id}"></div>\n\n`;

    content = content.replace(/\[VULN\]([\s\S]*?)(?:\[\/VULN\]|$)/g, "\n\n> 🛡️ **Vulnerability Logged to Dashboard**\n\n")

  async function handleSend() {
    let text = chatInput.value.trim();
    if (!text || state.isProcessing) return;
    
    const chat = state.chats.find(c => c.id === state.currentId);
    chat.messages.push({ role: 'user', content: text, timestamp: Date.now() });
    
    if (chat.messages.length === 1) {
      chat.title = text.substring(0, 30);
      renderHistory();
    }
    
    saveState();
    const wrapper = document.getElementById('messagesWrapper');
    wrapper.innerHTML += formatMessage({ role: 'user', content: text });
    chatInput.value = ''; chatInput.style.height = 'auto';
    document.getElementById('sendBtn').disabled = true;
    msgContainer.scrollTop = msgContainer.scrollHeight;

    state.isProcessing = true;
    document.getElementById('stopBtn').classList.remove('hidden');
    
    const msgId = Date.now().toString();
    const assistantMsg = { role: 'assistant', content: '', timestamp: msgId };
    chat.messages.push(assistantMsg);

    wrapper.innerHTML += `<div class="flex justify-start w-full mb-8" id="msg-${msgId}">
      <div class="flex gap-4 max-w-[95%]">
        <div class="w-8 h-8 rounded-full bg-white text-black flex items-center justify-center flex-shrink-0 mt-1 shadow-sm"><i data-lucide="bot" class="w-5 h-5"></i></div>
        <div class="flex-1 min-w-0"><div class="prose text-gray-400 animate-pulse">Processing...</div></div>
      </div>
    </div>`;
    lucide.createIcons();
    
    const asstContainer = document.getElementById(`msg-${msgId}`).querySelector('.prose');

    try {
      let fullReply = "";
      if (state.settings.apiKey && state.settings.baseUrl) {
        abortController = new AbortController();
        fullReply = await fetchRealAPIStream(chat.messages, (chunk) => {
          fullReply = chunk;
          asstContainer.innerHTML = formatMessage({ role: 'assistant', content: chunk }, true);
          if(autoScroll) msgContainer.scrollTop = msgContainer.scrollHeight;
        }, abortController.signal);
      } else {
        fullReply = await mockAPIStream(text, (chunk) => {
          asstContainer.innerHTML = formatMessage({ role: 'assistant', content: chunk }, true);
          if(autoScroll) msgContainer.scrollTop = msgContainer.scrollHeight;
        });
      }
      
      assistantMsg.content = fullReply;
      saveState();
      
      asstContainer.innerHTML = formatMessage({ role: 'assistant', content: fullReply }, false);
      enhanceRenderedContent(asstContainer);
      processWorkspace(fullReply);

    } catch (err) {
      if(err.name !== 'AbortError') asstContainer.innerHTML = `<span class="text-red-400">**Error:** ${err.message}</span>`;
    } finally {
      state.isProcessing = false;
      abortController = null;
      document.getElementById('stopBtn').classList.add('hidden');
      document.getElementById('sendBtn').disabled = chatInput.value.trim().length === 0;
    }
  }

  async function fetchRealAPIStream(messages, onChunk, signal) {
    const payload = {
      model: state.settings.model,
      messages: [{ role: 'system', content: state.settings.sysPrompt }, ...messages.slice(-10)],
      temperature: 0.7, stream: true
    };
    const res = await fetch(`${state.settings.baseUrl}/chat/completions`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.settings.apiKey}` },
      body: JSON.stringify(payload), signal
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let fullText = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value, { stream: true });
      for (const line of chunk.split('\n')) {
        if (line.startsWith('data: ') && line.trim() !== 'data: [DONE]') {
          try {
            const data = JSON.parse(line.slice(6));
            fullText += data.choices[0].delta.content || "";
            onChunk(fullText);
          } catch (e) {}
        }
      }
    }
    return fullText;
  }

  }

  function panicWipe() {
    if(confirm("OPSEC ALERT: Hapus seluruh history, API Key, dan konfigurasi?")) {
      localStorage.clear();
      location.reload();
    }
  }

  function saveState() { localStorage.setItem('c51_chats_offensive', JSON.stringify(state.chats)); }
  function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function deleteChat(e, id) {
    e.stopPropagation();
    state.chats = state.chats.filter(c => c.id !== id);
    if (state.currentId === id) state.currentId = state.chats.length > 0 ? state.chats[0].id : null;
    saveState();
    if (state.currentId) loadChat(state.currentId); else createNewChat();
  }

  function openSettings() {
    document.getElementById('apiBaseUrl').value = state.settings.baseUrl || '';
    document.getElementById('apiKey').value = state.settings.apiKey || '';
    document.getElementById('sysPromptInput').value = state.settings.sysPrompt || DEFAULT_PROMPT;
    document.getElementById('settingsModal').classList.remove('hidden');
  }
  function closeSettings() { document.getElementById('settingsModal').classList.add('hidden'); }
  function saveSettings() {
    state.settings.baseUrl = document.getElementById('apiBaseUrl').value.trim();
    state.settings.apiKey = document.getElementById('apiKey').value.trim();
    state.settings.sysPrompt = document.getElementById('sysPromptInput').value.trim();
    localStorage.setItem('c51_settings_offensive', JSON.stringify(state.settings));
    updateApiBadge();
    closeSettings();
  }
  function changeModel(val) {
    state.settings.model = val;
    localStorage.setItem('c51_settings_offensive', JSON.stringify(state.settings));
  }

  init();
</script>
</body>
</html>
